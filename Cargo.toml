[package]
name = "rust-chat-app"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-std = "1.10.0"
tokio-tungstenite = "0.26.2"
futures-util = "0.3"
jsonwebtoken = "9.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
protobuf = "3.7.2"  # Or latest version compatible with your project



